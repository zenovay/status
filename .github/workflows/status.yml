# Rebuild the backup status page.
#
# Runs on GitHub's runners and publishes to GitHub Pages, so the machine
# checking Zenovay is on a different network, run by a different company, from
# the one Zenovay runs on. Holds no secret: GITHUB_TOKEN is scoped to this
# repository.
name: status

on:
  schedule:
    # Only a restart for the chain below: GitHub drops frequent schedules on small
    # repositories (one run in six hours on 2026-10-26), so freshness cannot rely on it.
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['check.mjs', '.github/workflows/status.yml']

# One run at a time: two runs would race on the gh-pages branch.
concurrency:
  group: status
  cancel-in-progress: false

permissions:
  contents: write
  actions: write # the run starts its successor (workflow_dispatch is allowed with GITHUB_TOKEN)

jobs:
  publish:
    runs-on: ubuntu-latest
    # One run checks every 5 minutes for about 55 minutes, then starts the next run, so the page
    # stays fresh without depending on GitHub's schedule (or on anything Zenovay runs).
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - name: Load the previous results
        # history.json is a diff against the previous summary.json, so both
        # must be on disk first. The branch does not exist on the first run.
        run: |
          mkdir -p out
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch --depth 1 origin gh-pages
            git --work-tree=out checkout FETCH_HEAD -- .
            git reset -q
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check and publish every 5 minutes
        env:
          REPO: ${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          publish() {
            ( cd out
              rm -rf .git
              git init -q -b gh-pages
              git config user.name "zenovay-status"
              git config user.email "status@users.noreply.github.com"
              git add -A
              git commit -q -m "status: $(date -u +%Y-%m-%dT%H:%MZ)"
              git push -q -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" gh-pages )
          }
          # One commit, replaced every round: the page has to be republished each time so
          # its "updated" time stays fresh; what changed lives in history.json.
          for round in $(seq 1 11); do
            node check.mjs out && publish || echo "round $round failed, next one in 5 minutes"
            if [ "$round" -lt 11 ]; then sleep 300; fi
          done

      - name: Start the next run
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run status.yml --ref main -R "${{ github.repository }}"
