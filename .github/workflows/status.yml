# Rebuild the backup status page.
#
# Runs on GitHub's runners and publishes to GitHub Pages, so the machine
# checking Zenovay is on a different network, run by a different company, from
# the one Zenovay runs on. Holds no secret: GITHUB_TOKEN is scoped to this
# repository.
name: status

on:
  schedule:
    # GitHub queues scheduled runs and often starts them late, which is why the
    # page prints when each row was actually checked instead of promising an
    # interval.
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['check.mjs', '.github/workflows/status.yml']

# One run at a time: two runs would race on the gh-pages branch.
concurrency:
  group: status
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Load the previous results
        # history.json is a diff against the previous summary.json, so both
        # must be on disk first. The branch does not exist on the first run.
        run: |
          mkdir -p out
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch --depth 1 origin gh-pages
            git --work-tree=out checkout FETCH_HEAD -- .
            git reset -q
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check and render
        run: node check.mjs out

      - name: Publish
        # One commit, replaced every run: the page has to be republished each
        # time so its "updated" time stays fresh, and the record of what changed
        # lives in history.json rather than in thousands of identical commits.
        working-directory: out
        run: |
          git init -q -b gh-pages
          git config user.name "zenovay-status"
          git config user.email "status@users.noreply.github.com"
          git add -A
          git commit -q -m "status: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
