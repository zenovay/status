name: probe-test
on: workflow_dispatch
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://api.zenovay.com/health https://api.zenovay.com/health.js https://api.zenovay.com/nonexistent-check.js https://api.zenovay.com/z.js https://app.zenovay.com/favicon.ico https://app.zenovay.com/health.js https://zenovay.com/; do
            curl -s -o /dev/null -m 20 -A "zenovay-status-backup/1.0" -w "%{http_code} $u " -D /tmp/h "$u" || true
            grep -i "^cf-mitigated" /tmp/h | tr -d '\r' || echo "(no cf-mitigated)"
          done
